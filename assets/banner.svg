<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#79c0ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#30363d" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>

    <style>
      .mono { font-family: 'Fira Code', 'JetBrains Mono', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Ubuntu', 'Helvetica Neue', sans-serif; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .cursor { animation: blink 1s infinite; fill: #58a6ff; }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="900" height="220" rx="10" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.2"/>
  <rect width="900" height="220" rx="10" fill="url(#grid)"/>

  <!-- Top Window Header -->
  <rect width="900" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="900" height="10" fill="#161b22"/>
  <line x1="0" y1="34" x2="900" y2="34" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="24" cy="17" r="5" fill="#ec6a5e"/>
  <circle cx="42" cy="17" r="5" fill="#f5bf4f"/>
  <circle cx="60" cy="17" r="5" fill="#62c554"/>

  <!-- Window Title -->
  <text x="450" y="22" text-anchor="middle" fill="#8b949e" font-size="12" class="mono">ivnmtz09@workstation: ~/systems-engineering</text>

  <!-- Prompt and Command -->
  <text x="45" y="72" fill="#58a6ff" font-size="14" font-weight="600" class="mono">&gt; init --profile --author</text>

  <!-- Name / Title -->
  <text x="45" y="118" fill="url(#accent-grad)" font-size="38" font-weight="800" letter-spacing="1.5px" class="sans">IVAN MARTINEZ</text>
  <rect x="365" y="88" width="10" height="32" class="cursor"/>

  <!-- Subtitle / Role -->
  <text x="45" y="148" fill="#c9d1d9" font-size="15" font-weight="500" letter-spacing="0.5px" class="sans">Systems Engineering Student  |  Full Stack &amp; Software Developer</text>

  <!-- Tags / Pills -->
  <g transform="translate(45, 168)">
    <!-- Pill 1 -->
    <rect width="180" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="16" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600" class="mono">BACKEND ARCHITECTURE</text>
    
    <!-- Pill 2 -->
    <rect x="190" width="160" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="270" y="16" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600" class="mono">DISTRIBUTED SAAS</text>

    <!-- Pill 3 -->
    <rect x="360" width="165" height="24" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="442" y="16" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="600" class="mono">DEVOPS &amp; LINUX</text>
  </g>

  <!-- System Status Badge Right Side -->
  <g transform="translate(680, 75)">
    <rect width="175" height="117" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="18" y="26" fill="#8b949e" font-size="10" font-weight="600" class="mono">SYSTEM METRICS</text>
    <line x1="18" y1="36" x2="157" y2="36" stroke="#30363d" stroke-width="1"/>
    
    <!-- Status Line -->
    <circle cx="26" cy="52" r="4" fill="#3fb950"/>
    <text x="38" y="56" fill="#3fb950" font-size="11" font-weight="600" class="mono">STATUS: ONLINE</text>
    
    <!-- OS -->
    <text x="18" y="78" fill="#8b949e" font-size="11" class="mono">OS: Linux / x86_64</text>
    
    <!-- Location -->
    <text x="18" y="98" fill="#8b949e" font-size="11" class="mono">LOC: Riohacha, CO</text>
  </g>
</svg>
